name: Verificar 4J Finance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Instalar dependencias travadas
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Testes de logica e validacao publica
        run: node scripts/check.cjs
      - name: Reproducao do HTML publicado
        run: node scripts/verify-build.cjs
